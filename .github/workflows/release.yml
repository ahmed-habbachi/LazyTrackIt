name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          bin="lazytrackit"
          if [ "${{ matrix.goos }}" = "windows" ]; then bin="lazytrackit.exe"; fi
          version_pkg="github.com/ahmed-habbachi/lazytrackit/internal/version"
          go build -trimpath -ldflags "-s -w -X ${version_pkg}.Version=${{ github.ref_name }}" -o "$work/$bin" .

          mkdir -p dist
          base="lazytrackit_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            archive="dist/${base}.zip"
            GOOS= GOARCH= go run ./.github/scripts/zip.go "$work/$bin" "$archive" "$bin"
          else
            archive="dist/${base}.tar.gz"
            tar -czf "$archive" -C "$work" "$bin"
          fi

          (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  # The desktop app (cmd/lazytrackit-gui, Wails v3). It's a separate job
  # because, unlike the TUI, it isn't a pure-Go build everywhere:
  #   - Windows: no cgo needed (WebView2 is loaded at runtime), so it
  #     cross-compiles like the TUI. -H windowsgui stops Windows from
  #     opening a console window next to it.
  #   - Linux: needs cgo (a C compiler) plus the GTK 3 / WebKitGTK 4.1
  #     development packages, so it's built natively for amd64 on a
  #     GitHub-hosted Ubuntu runner, which has gcc and can apt-get the
  #     packages (the self-hosted runner has neither).
  #     The gtk3 build tag selects Wails' GTK 3 / WebKitGTK 4.1 backend;
  #     without it Wails v3 links GTK 4 / WebKitGTK 6.0.
  build-gui:
    name: Build GUI ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            cgo: "1"
            ldflags: ""
          - goos: windows
            goarch: amd64
            runner: self-hosted
            cgo: "0"
            ldflags: "-H windowsgui"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK / WebKitGTK dev packages
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          bin="lazytrackit-gui"
          if [ "${{ matrix.goos }}" = "windows" ]; then bin="lazytrackit-gui.exe"; fi
          version_pkg="github.com/ahmed-habbachi/lazytrackit/internal/version"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # Stamp the tag into the exe's version details (the icon and
            # manifest are the same either way).
            if command -v llvm-windres >/dev/null || command -v x86_64-w64-mingw32-windres >/dev/null || command -v windres >/dev/null; then
              packaging/windows/gen-syso.sh "${{ github.ref_name }}"
            else
              echo "::warning::no windres on the runner, so the exe keeps the committed resources (version 0.0.0)"
            fi
          fi
          go build -trimpath -tags gtk3 -ldflags "-s -w ${{ matrix.ldflags }} -X ${version_pkg}.Version=${{ github.ref_name }}" -o "$work/$bin" ./cmd/lazytrackit-gui

          mkdir -p dist
          # The "_desktop" suffix must match update.GUI.Variant. It keeps
          # GUI archives from ending in _<os>_<arch>.<ext>, which released
          # TUI versions suffix-match when picking their update.
          base="lazytrackit-gui_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}_desktop"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            archive="dist/${base}.zip"
            GOOS= GOARCH= CGO_ENABLED=0 go run ./.github/scripts/zip.go "$work/$bin" "$archive" "$bin"
          else
            archive="dist/${base}.tar.gz"
            tar -czf "$archive" -C "$work" "$bin"
          fi

          (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-gui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  installer:
    name: Build Windows installer
    needs: build-gui
    # Inno Setup only runs on Windows; GitHub's Windows image ships it.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the Windows GUI build
        uses: actions/download-artifact@v4
        with:
          name: build-gui-windows-amd64
          path: gui

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          $num = ($tag -replace '^v', '') -replace '[-+].*$', ''
          Expand-Archive "gui\lazytrackit-gui_${tag}_windows_amd64_desktop.zip" -DestinationPath bin
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$tag" "/DNumVersion=$num" "/DBinDir=$PWD\bin" "/DOutDir=$PWD\dist" packaging\windows\lazytrackit.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            [IO.File]::WriteAllText("$($_.FullName).sha256", "$hash  $($_.Name)`n")
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-installer-windows-amd64
          path: dist/*

  release:
    name: Publish release
    needs: [build, build-gui, installer]
    # A failed GUI build or installer build must not block the TUI release; it
    # just ships without them.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          body: |
            ## Download

            Grab the archive for your platform below, then see the
            [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#downloading-a-release)
            for where to extract it and how to run it.

            - **Linux (x86_64)**: `lazytrackit_${{ github.ref_name }}_linux_amd64.tar.gz`
            - **Linux (ARM64)**: `lazytrackit_${{ github.ref_name }}_linux_arm64.tar.gz`
            - **Windows (x86_64)**: `lazytrackit_${{ github.ref_name }}_windows_amd64.zip`

            Desktop app (tray icon + window, can start with the system):

            - **Windows installer (recommended on Windows)**: `lazytrackit-setup_${{ github.ref_name }}_windows_amd64.exe`
            - **Linux (x86_64)**: `lazytrackit-gui_${{ github.ref_name }}_linux_amd64_desktop.tar.gz`
            - **Windows (x86_64)**: `lazytrackit-gui_${{ github.ref_name }}_windows_amd64_desktop.zip`

            Each archive has a matching `.sha256` file if you want to verify
            the download.
