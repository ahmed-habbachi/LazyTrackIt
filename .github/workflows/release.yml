name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          bin="lazytrackit"
          if [ "${{ matrix.goos }}" = "windows" ]; then bin="lazytrackit.exe"; fi
          go build -trimpath -ldflags "-s -w" -o "$work/$bin" .

          mkdir -p dist
          base="lazytrackit_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            archive="dist/${base}.zip"
            GOOS= GOARCH= go run ./.github/scripts/zip.go "$work/$bin" "$archive" "$bin"
          else
            archive="dist/${base}.tar.gz"
            tar -czf "$archive" -C "$work" "$bin"
          fi

          (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          body: |
            ## Download

            Grab the archive for your platform below, then see the
            [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#downloading-a-release)
            for where to extract it and how to run it.

            - **Linux (x86_64)**: `lazytrackit_${{ github.ref_name }}_linux_amd64.tar.gz`
            - **Linux (ARM64)**: `lazytrackit_${{ github.ref_name }}_linux_arm64.tar.gz`
            - **Windows (x86_64)**: `lazytrackit_${{ github.ref_name }}_windows_amd64.zip`

            Each archive has a matching `.sha256` file if you want to verify
            the download.
