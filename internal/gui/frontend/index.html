<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Everything is bundled; nothing may load from elsewhere. Inline styles
       are allowed only for the per-entry color custom property. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>LazyTrackIt</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="Week and status">
      <header class="brand">
        <span class="brand-mark" aria-hidden="true"><img src="/trackit-logo.png" alt=""></span>
        <div class="brand-text">
          <h1>LazyTrackIt</h1>
          <p class="brand-sub" id="member">&nbsp;</p>
        </div>
      </header>

      <nav class="week-nav" aria-label="Week">
        <button class="icon-btn" id="prev-week" title="Previous week (←)" aria-label="Previous week"><i data-icon="chevron-left"></i></button>
        <button class="week-label" id="this-week" title="Jump to this week (T)"></button>
        <button class="icon-btn" id="next-week" title="Next week (→)" aria-label="Next week"><i data-icon="chevron-right"></i></button>
      </nav>

      <section class="card meter" aria-label="Logged hours">
        <p class="eyebrow"><i data-icon="clock"></i>Logged</p>
        <div class="meter-figures">
          <span class="meter-logged" id="logged">0h00</span>
          <span class="meter-expected" id="expected">of 0h00</span>
        </div>
        <div class="meter-track"><div class="meter-fill" id="meter-fill"></div><div class="meter-mark" id="meter-mark"></div></div>
        <p class="meter-delta" id="delta"></p>
      </section>

      <section class="card attendance" id="attendance-card" hidden aria-label="Attendance">
        <p class="eyebrow"><i data-icon="map-pin"></i>Attendance</p>
        <p class="attendance-status" id="attendance-status">…</p>
        <button class="btn btn-secondary" id="attendance-btn">Check in</button>
      </section>

      <div class="rail-foot">
        <button type="button" class="btn btn-secondary settings-btn" id="open-settings" title="Providers, start at login, versions">
          <i data-icon="settings"></i>Settings
        </button>
        <div class="rail-versions">
          <p><span class="rail-provider" id="provider-name"></span> <span id="backend-version" hidden></span></p>
          <p id="version"></p>
        </div>
      </div>
    </aside>

    <main class="ledger" id="ledger">
      <div class="ledger-head">
        <div class="ledger-title">
          <h2 id="headline">This week</h2>
          <p class="range" id="range"></p>
        </div>
        <div class="ledger-actions">
          <button class="icon-btn icon-btn-outline" id="refresh" title="Refresh (R)" aria-label="Refresh"><i data-icon="refresh-cw"></i></button>
          <button class="btn btn-primary" id="new-entry" title="New entry (N)"><i data-icon="plus"></i>New entry</button>
        </div>
      </div>
      <p class="notice" id="update-notice" hidden></p>
      <p class="error-banner" id="error" role="alert" hidden></p>
      <div id="days" class="days" aria-live="polite"></div>
    </main>
  </div>

  <!-- Entry form drawer -->
  <div class="scrim" id="drawer-scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawer-title">
    <form id="entry-form" novalidate>
      <header class="drawer-head">
        <h3 id="drawer-title">New entry</h3>
        <button type="button" class="icon-btn" id="drawer-close" aria-label="Close"><i data-icon="x"></i></button>
      </header>
      <label class="field">
        <span>Project</span>
        <select id="f-project" required></select>
      </label>
      <label class="field">
        <span>Description</span>
        <textarea id="f-description" rows="3" maxlength="500" placeholder="What did you work on?"></textarea>
      </label>
      <fieldset class="field">
        <legend>Tags</legend>
        <div class="chips" id="f-tags"><span class="muted">Pick a project to see its tags.</span></div>
      </fieldset>
      <div class="when">
        <label class="field">
          <span>Date</span>
          <input type="date" id="f-date" required>
        </label>
        <label class="field">
          <span>From</span>
          <input type="time" id="f-from" required>
        </label>
        <label class="field">
          <span>To</span>
          <input type="time" id="f-to" required>
        </label>
      </div>
      <p class="duration" id="f-duration"></p>
      <p class="form-error" id="f-error" role="alert"></p>
      <footer class="drawer-foot">
        <button type="button" class="btn btn-danger" id="f-delete" hidden><i data-icon="trash"></i>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-secondary" id="f-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="f-save">Save</button>
      </footer>
    </form>
  </aside>

  <!-- Generic modal: login prompt, check in/out, setup -->
  <div class="scrim" id="modal-scrim" hidden></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <footer class="modal-foot" id="modal-foot"></footer>
  </div>
</body>
</html>
